# BẬT THÊM 16 CONTAINER WARP (tổng 32) -> gấp đôi nguồn IPv6 (mỗi container 1 IP riêng).
#
# CẦN NÂNG GIỚI HẠN inotify TRƯỚC, nếu không container mới sẽ lỗi "Too many open files" và không lên được:
#   sudo sysctl -w fs.inotify.max_user_instances=1024      # hiện tại là 128 -> tối đa ~16 container
#   (muốn số 32 thì 1024 là dư; nhớ: 1 container warp-svc dùng vài inotify instance)
#
# Dùng:
#   docker compose -f docker-compose.warp.yml -f docker-compose.warp32.yml up -d
#
# Lưu ý: thêm container = thêm RAM (~256 MB mỗi container) và nhiều IPv6 hơn (mỗi IPv6 là 1 nguồn hạn mức riêng
# phía upstream). Gateway tự phát hiện IP mới lúc khởi động (detectWarpIPs) và ưu tiên container có IP riêng.

services:
  warp17:
    image: caomingjun/warp:latest
    container_name: warp-proxy-17
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1096:1080"
    mem_limit: 256m

  warp18:
    image: caomingjun/warp:latest
