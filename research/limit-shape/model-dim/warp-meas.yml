services:
  warpmeas1:
    image: caomingjun/warp:latest
    container_name: warp-meas-1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1200:1080"
    mem_limit: 512m

