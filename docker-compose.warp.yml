services:
  warp:
    image: caomingjun/warp:latest
    container_name: warp-proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1080:1080"
    mem_limit: 512m

  warp2:
    image: caomingjun/warp:latest
    container_name: warp-proxy-2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1081:1080"
    mem_limit: 512m

  warp3:
    image: caomingjun/warp:latest
    container_name: warp-proxy-3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1082:1080"
    mem_limit: 512m

  warp4:
    image: caomingjun/warp:latest
    container_name: warp-proxy-4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1083:1080"
    mem_limit: 512m

  redis:
    image: redis:7.4-alpine
    container_name: orw-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - orw-redis:/data
    mem_limit: 512m

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: orw-new:latest
    container_name: orw-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis
      - warp
      - warp2
      - warp3
      - warp4
    ports:
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DISABLE_TOR: "true"
      PROXY_POOL: "socks5://warp:1080,socks5://warp2:1080,socks5://warp3:1080,socks5://warp4:1080"
      # Proxy dân cư + link đổi IP: BÍ MẬT, đọc từ file .env cạnh compose (xem .env.example). Không commit key vào repo.
      RESIDENTIAL_PROXIES: "${RESIDENTIAL_PROXIES:-}"
      RESIDENTIAL_REFRESH_URLS: "${RESIDENTIAL_REFRESH_URLS:-}"
      # Loại beam khỏi auto pool để dành 100% quota cho gọi thẳng beam
      AUTO_MODELS: "${AUTO_MODELS:-nemotron-3.5-lightning,glm-5.3-flash,deepseek-v4.1-flash,mimo-v2.6-flash}"
      MAX_ATTEMPTS: "8"
      DEFAULT_MODEL: "beam"
      # Gọi đích danh model thì giữ nguyên model đó (client muốn cho đổi: header X-Model-Fallback: allow)
      AUTO_MODEL_FALLBACK: "false"
      # Request đồng bộ xếp hàng chờ egress tối đa 30 phút thay vì báo lỗi; job nền thì không giới hạn (Redis)
      # Ngân sách session MỚI trên mỗi IP trong ngày UTC. Đo 2026-10-26 (research/limit-shape/model-dim):
      # đơn vị tiêu thụ THẬT là số REQUEST của cặp (IP, model) - 1 session cố định phục vụ 64 request rồi mới
      # 429, nên giới hạn "số session mới" chỉ gây thiếu sức chứng -> tắt (0 = không giới hạn).
      SESSION_DAILY_BUDGET: "0"
      # Ngân sách per (IP, model) - đo 2026-10-26:
      #   MODEL_QUOTA_DEFAULT  : trần request/ngày của 1 model trên 1 IP khi chưa biết (glm đo được ~60-70)
      #   MODEL_QUOTA_OVERRIDES: trần riêng theo model (nemotron đo được >203)
      #   QUOTA_AUTO_SHARE     : phần ngân sách mỗi cặp dành cho kênh auto, phần còn lại cho gọi thẳng model đó
      #   QUOTA_HARD_AFTER     : số 429 hạn mức liên tiếp thì mới coi cặp đó thật sự cạn (xoay danh tính WARP)
      MODEL_QUOTA_DEFAULT: "64"
      MODEL_QUOTA_OVERRIDES: "beam-free=200,nemotron-3.5-lightning-free=256,deepseek-v4.1-flash-free=80"
      QUOTA_AUTO_SHARE: "0.0"
      QUOTA_HARD_AFTER: "2"
      SESSIONS_PER_EGRESS: "16"
      SESSION_INFLIGHT: "4"
      SESSION_REPROBE: "2m"
      SESSION_COOL_MAX: "5m"
      LIMIT_WARP: "50"
      LIMIT_MIN: "10"
      LIMIT_MAX: "60"
      WARP_RENEW_PARALLEL: "1"
      MAX_WAIT: "60s"
      QUEUE_WAIT: "60s"
      DIRECT_COOLDOWN: "2m"
      MAX_CONCURRENCY: "20000"
      RATE_LIMIT_RPM: "0" # gateway nội bộ: không giới hạn tốc độ theo IP client (đã có ALLOWED_IPS)
      REDIS_URL: "redis://redis:6379"
      JOB_WORKERS: "256"
    mem_limit: 1024m

volumes:
  orw-redis:
